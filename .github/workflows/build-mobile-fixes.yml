name: Verify and build mobile fixes
on:
  push:
    branches: ['build/android-mobile-fixes-*']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RE0_KEYSTORE_PATH: ${{ github.workspace }}/android/app/re0-release.jks
      RE0_KEYSTORE_PASSWORD: ${{ secrets.RE0_KEYSTORE_PASSWORD }}
      RE0_KEY_ALIAS: ${{ secrets.RE0_KEY_ALIAS }}
      RE0_KEY_PASSWORD: ${{ secrets.RE0_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Verify frozen source
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          for name,digest in json.loads(Path('source-sha256.json').read_text()).items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY
      - run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub | tee analyze.log
      - name: Test
        run: |
          set -o pipefail
          flutter test --no-pub --concurrency=2 --reporter expanded | tee all-tests.log
      - name: Configure original signing
        env:
          RE0_KEYSTORE_BASE64: ${{ secrets.RE0_KEYSTORE_BASE64 }}
        run: |
          test -n "$RE0_KEYSTORE_BASE64" && test -n "$RE0_KEYSTORE_PASSWORD" && test -n "$RE0_KEY_ALIAS" && test -n "$RE0_KEY_PASSWORD"
          printf '%s' "$RE0_KEYSTORE_BASE64" | base64 --decode > "$RE0_KEYSTORE_PATH"
          chmod 600 "$RE0_KEYSTORE_PATH"
      - name: Build APK 1.2.41
        run: |
          set -o pipefail
          flutter build apk --release --no-pub --dart-define=RE0_VERSION_NAME=1.2.41 --dart-define=RE0_VERSION_CODE=10241 --dart-define=RE0_RELEASE_TAG=v1.2.41 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RE0-mobile-fixes-1.2.41
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            analyze.log
            all-tests.log
            build.log
            source-sha256.json
          retention-days: 14
