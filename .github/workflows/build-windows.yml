name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: ['build/windows-*']
    tags: ['windows-v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Build installer and portable archive
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify installation, launch and removal
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RE0-windows-x64
          path: build/release/
          if-no-files-found: error
          retention-days: 14
