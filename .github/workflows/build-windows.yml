name: Build Windows
on:
  workflow_dispatch:
    inputs:
      verified_build_run:
        description: 'Reuse an installer only when production source is identical (optional CI run ID)'
        required: false
        default: ''
  push:
    branches: ['build/windows-*']
    tags: ['windows-v*']
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Build installer and portable archive
        if: inputs.verified_build_run == ''
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Reuse verified installer when only the UI check changed
        if: inputs.verified_build_run != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RE0_BUILD_RUN: ${{ inputs.verified_build_run }}
        run: |
          $re0Run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RE0_BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -or $re0Run.status -ne 'completed') { throw 'Build run must be complete' }
          $re0Jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RE0_BUILD_RUN/jobs" | ConvertFrom-Json
          $re0Build = @($re0Jobs.jobs.steps | Where-Object name -eq 'Build installer and portable archive')
          if ($re0Build.Count -ne 1 -or $re0Build[0].conclusion -ne 'success') { throw 'Build and full checks must have passed' }
          $re0Diff = gh api "repos/$env:GITHUB_REPOSITORY/compare/$($re0Run.head_sha)...$env:GITHUB_SHA" | ConvertFrom-Json
          if ($LASTEXITCODE -or $re0Diff.status -notin @('ahead','identical')) { throw 'Cannot verify source ancestry' }
          $re0Changes = @($re0Diff.files | Where-Object filename -notin @('.github/workflows/build-windows.yml','integration_test/desktop_menu_smoke_test.dart'))
          if ($re0Changes.Count) { throw 'Production source changed; a new build is required' }
          gh run download $env:RE0_BUILD_RUN -R $env:GITHUB_REPOSITORY -n RE0-windows-x64 -D build/release
          if ($LASTEXITCODE) { throw 'Artifact download failed' }
          $re0Manifest = Get-Content build/release/manifest.json -Raw | ConvertFrom-Json
          $re0Installer = Get-Item "build/release/$($re0Manifest.file_name)"
          if ($re0Installer.Length -ne $re0Manifest.file_size -or (Get-FileHash $re0Installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $re0Manifest.sha256) { throw 'Artifact checksum mismatch' }
      - name: Open generation and management menus in a native Windows window
        shell: pwsh
        env:
          RE0_CAPTURE_MENUS: native-windows
          RE0_MENU_EVIDENCE: ${{ github.workspace }}/evidence/screenshots/menu-fixes-20261007
        run: |
          if (Test-Path 'C:/Windows/Fonts/msyh.ttc') {
            $env:RE0_CJK_FONT = 'C:/Windows/Fonts/msyh.ttc'
          } else {
            $env:RE0_CJK_FONT = "$env:RUNNER_TEMP/re0-menu-cjk.ttf"
            Invoke-WebRequest 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf' -OutFile $env:RE0_CJK_FONT
          }
          flutter test integration_test/desktop_menu_smoke_test.dart -d windows --reporter expanded
          if ($LASTEXITCODE) { throw 'Native menu verification failed' }
      - name: Verify installation, launch and removal
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Collect opened menu evidence
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'evidence/screenshots/menu-fixes-20261007/native-windows') {
            New-Item -ItemType Directory -Force build/release | Out-Null
            Copy-Item 'evidence/screenshots/menu-fixes-20261007/native-windows' build/release/menu-evidence -Recurse -Force
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RE0-windows-x64
          path: build/release/
          if-no-files-found: error
          retention-days: 14
