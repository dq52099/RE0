buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    // Flutter plugins may declare their own AGP/Kotlin versions. Keep their
    // build classpaths on the toolchain selected by this app and its wrapper.
    buildscript.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.tools.build' &&
                    details.requested.name == 'gradle') {
                details.useVersion '8.9.1'
            }
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name == 'kotlin-gradle-plugin') {
                details.useVersion '2.1.0'
            }
        }
    }
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
